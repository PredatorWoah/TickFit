<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <!-- Privacy by construction: the browser itself refuses to talk to anyone except this site,
       plus Google's Gemini API (only used if YOU add your own key in More > AI helper). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <script src="js/theme-boot.js"></script>
  <meta name="description" content="TickFit: a free, offline gym and meal checklist. No account, no tracking.">
  <title>TickFit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TickFit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <nav id="nav" aria-label="Main"></nav>
  <noscript><p style="padding:16px">TickFit needs JavaScript to run. Nothing is sent anywhere.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
