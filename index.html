<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d12">
  <!-- Privacy by construction: the browser itself refuses to talk to anyone except this site,
       plus Google's Gemini API (only used if YOU add your own key in More > AI helper). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com https://world.openfoodfacts.org; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <script src="js/theme-boot.js"></script>
  <meta name="description" content="TickFit: a free, offline gym and meal checklist. No account, no tracking.">
  <title>TickFit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TickFit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Fetch every module the app needs at startup in parallel, instead of finding them one by one as each file loads.
       tests/preload.mjs keeps this list in step with the real imports. -->
  <link rel="modulepreload" href="js/adjustui.js">
  <link rel="modulepreload" href="js/ai.js">
  <link rel="modulepreload" href="js/backnav.js">
  <link rel="modulepreload" href="js/backup.js">
  <link rel="modulepreload" href="js/backupui.js">
  <link rel="modulepreload" href="js/burn.js">
  <link rel="modulepreload" href="js/dates.js">
  <link rel="modulepreload" href="js/dayview.js">
  <link rel="modulepreload" href="js/dom.js">
  <link rel="modulepreload" href="js/estimate.js">
  <link rel="modulepreload" href="js/extract.js">
  <link rel="modulepreload" href="js/gemini.js">
  <link rel="modulepreload" href="js/home.js">
  <link rel="modulepreload" href="js/icons.js">
  <link rel="modulepreload" href="js/install.js">
  <link rel="modulepreload" href="js/logging.js">
  <link rel="modulepreload" href="js/meals.js">
  <link rel="modulepreload" href="js/more.js">
  <link rel="modulepreload" href="js/notes.js">
  <link rel="modulepreload" href="js/notesui.js">
  <link rel="modulepreload" href="js/parser.js">
  <link rel="modulepreload" href="js/plans.js">
  <link rel="modulepreload" href="js/platform.js">
  <link rel="modulepreload" href="js/progress.js">
  <link rel="modulepreload" href="js/safety.js">
  <link rel="modulepreload" href="js/schedule.js">
  <link rel="modulepreload" href="js/sheet.js">
  <link rel="modulepreload" href="js/stats.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/summary.js">
  <link rel="modulepreload" href="js/lift.js">
  <link rel="modulepreload" href="js/library.js">
  <link rel="modulepreload" href="js/merge.js">
  <link rel="modulepreload" href="js/mergeui.js">
  <link rel="modulepreload" href="js/theme.js">
  <link rel="modulepreload" href="js/timer.js">
  <link rel="modulepreload" href="js/update.js">
  <link rel="modulepreload" href="js/weight.js">
  <link rel="modulepreload" href="js/weightui.js">
  <link rel="modulepreload" href="js/widgetdata.js">
  <link rel="modulepreload" href="js/widgets.js">
  <link rel="modulepreload" href="js/workout.js">
</head>
<body>
  <main id="app"></main>
  <nav id="nav" aria-label="Main"></nav>
  <noscript><p style="padding:16px">TickFit needs JavaScript to run. Nothing is sent anywhere.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
