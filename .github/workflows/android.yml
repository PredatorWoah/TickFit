# Builds the TickFit Android app (an APK with the whole web app packed inside, using Capacitor).
#
#   * Publish a GitHub Release (tag like v1.0.0)  -> builds a SIGNED APK and attaches it to that release.
#   * Run it by hand (Actions tab) or push changes under android-app/ -> builds a TEST APK
#     (signed with a throwaway debug key, not for sharing) and keeps it as a workflow artifact.
#
# One-time setup for signed releases: add four repository secrets (Settings > Secrets and variables > Actions).
# See docs/ANDROID.md. Never commit the keystore.
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name, like 1.0.0
        default: 1.0.0
  release:
    types: [published]
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
      - 'js/platform.js'

permissions:
  contents: write # attach the APK to a release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Run the tests first
        run: node tests/all.mjs

      - name: Work out the version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="0.0.0-test"
          fi
          V="${V#v}"
          case "$V" in (*[!0-9A-Za-z.+-]*|"") echo "Odd version: $V"; exit 1;; esac
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_B64" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: A release needs the signing key
        if: github.event_name == 'release' && steps.ver.outputs.signed != 'true'
        run: |
          echo "::error::No signing key found. Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (see docs/ANDROID.md), then re-run this job."
          exit 1

      - name: Install the Android build tools (npm)
        working-directory: android-app
        run: npm ci

      - name: Create the Android project
        working-directory: android-app
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          node scripts/prepare.mjs
          npx cap add android
          node scripts/customize.mjs
          npx cap sync android

      - name: Build the APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          if [ "${{ steps.ver.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Sign the release APK
        if: steps.ver.outputs.signed == 'true'
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android-app/android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p dist
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          KS_PASS="$KEYSTORE_PASSWORD" KEYPASS="$KEY_PASSWORD" "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEYPASS \
            --out "dist/TickFit-${{ steps.ver.outputs.name }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "dist/TickFit-${{ steps.ver.outputs.name }}.apk" | grep -E "SHA-256|Verified"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect the test APK
        if: steps.ver.outputs.signed != 'true'
        run: |
          mkdir -p dist
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk "dist/TickFit-${{ steps.ver.outputs.name }}-TEST.apk"

      - name: Checksum
        run: |
          cd dist
          sha256sum *.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: TickFit-android-${{ steps.ver.outputs.name }}
          path: dist/*
          retention-days: 30

      - name: Attach to the release
        if: github.event_name == 'release' && steps.ver.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.apk dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
