# Builds the TickFit Android app (an APK with the whole web app packed inside, using Capacitor), and Stride
# (stride/, the companion workout planner) next to it. Every release carries both APKs, signed with the same key.
# Stride's APK is named TickFit-Stride-X.Y.Z.apk on purpose: GitHub lists release files by name, and TickFit's in-app
# updater before 2.8.1 took the first APK listed, so TickFit-X.Y.Z.apk must sort first ("2" comes before "S").
#
#   * Merge to main with a NEW version in android-app/VERSION -> builds a SIGNED APK and publishes the
#     release "vX.Y.Z" with it, all by itself. Merges that keep the same version only make a test build.
#   * Publish a GitHub Release (tag like v1.0.0)  -> builds a SIGNED APK and attaches it to that release.
#   * Run it by hand (Actions tab) or push changes under android-app/ -> builds a TEST APK
#     (signed with a throwaway debug key, not for sharing) and keeps it as a workflow artifact.
#
# One-time setup for signed releases: add four repository secrets (Settings > Secrets and variables > Actions).
# See docs/ANDROID.md. Never commit the keystore.
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name, like 1.0.0
        default: 1.0.0
  release:
    types: [published]
  push:
    paths: # everything that goes into the app, so a change to any of it makes a fresh test APK
      - 'android-app/**'
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - 'icons/**'
      - 'vendor/**'
      - 'stride/**'

permissions:
  contents: write # attach the APK to a release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Run the tests first
        run: node tests/all.mjs

      - name: Work out the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTO=false
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ -s android-app/VERSION ]; then
            V="$(tr -d ' \r\n' < android-app/VERSION)"
            # Publish only when this version has no release yet and the signing key is set up.
            if [ -n "$KEYSTORE_B64" ] && ! gh release view "v${V#v}" --repo "${{ github.repository }}" >/dev/null 2>&1; then AUTO=true; else V="${V#v}-main"; fi
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="0.0.0-test"
          fi
          V="${V#v}"
          case "$V" in (*[!0-9A-Za-z.+-]*|"") echo "Odd version: $V"; exit 1;; esac
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "auto=$AUTO" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if [ -n "$KEYSTORE_B64" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: A release needs the signing key
        if: github.event_name == 'release' && steps.ver.outputs.signed != 'true'
        run: |
          echo "::error::No signing key found. Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (see docs/ANDROID.md), then re-run this job."
          exit 1

      - name: Install the Android build tools (npm)
        working-directory: android-app
        run: npm ci

      - name: Create the Android project
        working-directory: android-app
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          node scripts/prepare.mjs
          npx cap add android
          node scripts/customize.mjs
          npx cap sync android

      - name: Build the APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          if [ "${{ steps.ver.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Stride
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null
          if [ "${{ steps.ver.outputs.signed }}" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          gradle -p stride --no-daemon ":app:$TASK" -PstrideVersionName="$VERSION_NAME" -PstrideVersionCode="$VERSION_CODE"

      - name: Sign the release APKs
        if: steps.ver.outputs.signed == 'true'
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          sign() { # sign <unsigned apk> <name in dist/>
            "$BT/zipalign" -p -f 4 "$1" "$RUNNER_TEMP/aligned.apk"
            KS_PASS="$KEYSTORE_PASSWORD" KEYPASS="$KEY_PASSWORD" "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEYPASS \
              --out "dist/$2" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "dist/$2" | grep -E "SHA-256|Verified"
            rm -f "$RUNNER_TEMP/aligned.apk"
          }
          sign "$(ls android-app/android/app/build/outputs/apk/release/*.apk | head -1)" "TickFit-${{ steps.ver.outputs.name }}.apk"
          sign "$(ls stride/app/build/outputs/apk/release/*.apk | head -1)" "TickFit-Stride-${{ steps.ver.outputs.name }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect the test APK
        if: steps.ver.outputs.signed != 'true'
        run: |
          mkdir -p dist
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk "dist/TickFit-${{ steps.ver.outputs.name }}-TEST.apk"
          cp stride/app/build/outputs/apk/debug/app-debug.apk "dist/TickFit-Stride-${{ steps.ver.outputs.name }}-TEST.apk"

      - name: Checksum
        run: |
          cd dist
          sha256sum *.apk | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v6
        with:
          name: TickFit-android-${{ steps.ver.outputs.name }}
          path: dist/*
          retention-days: 30

      - name: Attach to the release
        if: github.event_name == 'release' && steps.ver.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/*.apk dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"

      - name: Publish the release
        if: steps.ver.outputs.auto == 'true' && steps.ver.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.name }}"
          gh release create "v$V" dist/*.apk dist/SHA256SUMS.txt --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "TickFit $V" --generate-notes \
            --notes "Download TickFit-$V.apk below and open it on your Android phone. It installs over the previous version and keeps your data. Android asks once to allow installs from your browser or files app. TickFit-Stride-$V.apk is Stride, the workout planner that sends days and weeks to TickFit (More > Exercises from Stride); it installs as its own app."
